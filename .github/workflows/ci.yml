name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # After the build: e2e resolves the library's types from its dist.
      - run: pnpm --filter e2e typecheck
      - run: pnpm check:exports
      # Report-only: prints each entry's min+gzip size to the job log.
      - run: pnpm size

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]
        tz: [America/New_York, Australia/Sydney]
    name: unit (React ${{ matrix.react }}, ${{ matrix.tz }})
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # CI only, never committed: the library's own dev dependencies are React 19.
      - if: matrix.react == 18
        run: pnpm --filter @b.taranenko/react-input-calendar add -D react@18 react-dom@18 @types/react@18 @types/react-dom@18
      - run: TZ=${{ matrix.tz }} pnpm test:coverage

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter e2e exec playwright install --with-deps
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report

  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm compat
